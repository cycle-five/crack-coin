[package]
name = "crack-coin"
version = "0.1.0"
edition = "2021"
authors = ["Cycle Five <cycle.five@proton.me>"]
publish = false
license = "MIT"
description = "CrackCoin: a worthless-by-design Solana devnet token for the CrackTunes Discord bot."
keywords = ["solana", "devnet", "token", "discord", "crack"]
categories = ["cryptography::cryptocurrencies"]
homepage = "https://cracktun.es/"
repository = "https://github.com/cycle-five/crack-coin"

[dependencies]
base64 = "0.22"
bs58 = "0.5"
curve25519-dalek = "4.1"
ed25519-dalek = "2.2"
getrandom = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[features]
cli = ["dep:getrandom"]

[[bin]]
name = "crack-coin"
required-features = ["cli"]
